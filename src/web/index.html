<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digimon Atlas</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Game8 / Digimon Story Time Stranger</p>
      <h1>Digimon Atlas</h1>
      <p class="subtitle">Pesquise a linha evolutiva completa do seu Digimon.</p>
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Pesquisar por nome..." autocomplete="off">
      </label>
      <p id="result-count" class="result-count" aria-live="polite"></p>
    </header>
    <section id="digimon-list" class="digimon-list" aria-live="polite"></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>

</html>
